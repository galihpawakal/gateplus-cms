name: Migrate production database

on:
  push:
    branches: [master]
    paths:
      - 'prisma/**'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      POSTGRES_PRISMA_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      POSTGRES_URL_NON_POOLING: ${{ secrets.SUPABASE_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:migrate:deploy