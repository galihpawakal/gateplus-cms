# Local development only. Not used in CI or production.
services:
  postgres:
    image: postgres:16-alpine
    container_name: gateplus-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gateplus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env file}
      POSTGRES_DB: ${POSTGRES_DB:-gateplus_cms}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gateplus} -d ${POSTGRES_DB:-gateplus_cms}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata: